<script>
(function () {
    var light = "#f4f6f3", dark = "#151917";
    var userColor = null;
    function apply() {
        var mode = document.documentElement.getAttribute("data-theme") || "auto";
        var isDark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute("content", userColor || (isDark ? dark : light));
        });
    }
    document.addEventListener("click", function (e) {
        if (e.target && e.target.closest && e.target.closest("#theme-toggle")) setTimeout(apply, 60);
    });
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", apply);
    apply();
})();
</script>
<script>
(function () {
    var root = document.documentElement;
    root.classList.add("sg-js");
    function setup() {
        if (!("IntersectionObserver" in window)) return;
        var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
                if (!en.isIntersecting) return;
                en.target.classList.add("is-inview");
                io.unobserve(en.target);
            });
        }, { threshold: 0.2 });
        document.querySelectorAll(".sg-section-head, .post-header").forEach(function (el) {
            io.observe(el);
        });
         
        setTimeout(function () {
            document.querySelectorAll(".sg-section-head, .post-header").forEach(function (el) {
                el.classList.add("is-inview");
            });
        }, 1200);
    }
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", setup);
    } else {
        setup();
    }
    document.addEventListener("click", function (e) {
        if (e.target && e.target.closest && e.target.closest("#theme-toggle")) {
             
            if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            root.classList.add("sg-theme-anim");
            setTimeout(function () { root.classList.remove("sg-theme-anim"); }, 420);
        }
    });
})();
</script>
<script data-sg="sidenote">
(function () {
    function ready(fn) {
        if (document.readyState !== "loading") fn();
        else document.addEventListener("DOMContentLoaded", fn);
    }
    function build() {
        if (!document.querySelector(".post-content") || !document.querySelector(".footnotes")) return;
        if (!(window.CSS && CSS.supports && CSS.supports("selector(:has(a))"))) return;
        var notes = document.querySelectorAll('.footnotes ol > li[id^="fn:"]');
        notes.forEach(function (li) {
            var num = li.id.slice(3);
            var ref = document.querySelectorAll('a[href="#fn:' + num + '"]')[0];
            if (!ref) return;
            var block = ref.closest("p, li");
            if (!block || block.querySelector('.sidenote[data-for="fn:' + num + '"]')) return;
            var side = document.createElement("span");
            side.className = "sidenote";
            side.setAttribute("data-for", "fn:" + num);
            side.innerHTML = '<span class="sidenote-number">' + num + "</span> " + li.innerHTML;
            var back = side.querySelector(".footnote-backlink");
            if (back) back.remove();
            block.appendChild(side);
            var refSup = ref.closest("sup") || ref.parentElement;
            function point(on) {
                side.classList.toggle("is-pointed", on);
                refSup.classList.toggle("is-pointed", on);
            }
            side.addEventListener("mouseenter", function () { point(true); });
            side.addEventListener("mouseleave", function () { point(false); });
            ref.addEventListener("mouseenter", function () { point(true); });
            ref.addEventListener("mouseleave", function () { point(false); });
        });
        
        
        
        
        
        var converted = 0;
        notes.forEach(function (li) {
            var num = li.id.slice(3);
            if (document.querySelector('.sidenote[data-for="fn:' + num + '"]')) converted++;
        });
        var content = document.querySelector(".post-content");
        if (content) {
            content.classList.toggle("sg-sidenotes-complete", notes.length > 0 && converted === notes.length);
        }
    }
    ready(build);
    window.addEventListener("load", build);
    setTimeout(build, 1500);
})();
</script>

<script>
    document.getElementById("theme-toggle").addEventListener("click", (e) => {
        const html = document.querySelector("html");
        const flip = () => {
            if (html.dataset.theme === "dark") {
                html.dataset.theme = "light";
                localStorage.setItem("pref-theme", "light");
            } else {
                html.dataset.theme = "dark";
                localStorage.setItem("pref-theme", "dark");
            }
             
            document.dispatchEvent(new CustomEvent("sg:themechange", { detail: { theme: html.dataset.theme } }));
        };
        

        if (!document.startViewTransition || matchMedia("(prefers-reduced-motion: reduce)").matches) {
            flip();
            return;
        }
        let x = e.clientX, y = e.clientY;
        if (!x && !y) {
            const r = e.currentTarget.getBoundingClientRect();
            x = r.left + r.width / 2;
            y = r.top + r.height / 2;
        }
        const endRadius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
        const transition = document.startViewTransition(flip);
        transition.ready.then(() => {
            document.documentElement.animate(
                {
                    clipPath: [
                        `circle(0px at ${x}px ${y}px)`,
                        `circle(${endRadius}px at ${x}px ${y}px)`,
                    ],
                },
                {
                    duration: 400,
                    easing: "ease-in-out",
                    pseudoElement: "::view-transition-new(root)",
                },
            );
        });
    })
</script>
